# Weekly EU Healthcare Compliance Audit Sync
#
# Runs every Monday morning and updates the compliance audit summary inside
# README.md (between <!-- WEEKLY-COMPLIANCE-START --> and
# <!-- WEEKLY-COMPLIANCE-END -->), then opens a PR with the changes.
#
# The pipeline only depends on git and the GitHub REST API (the sync script
# uses only the Python standard library) - no external services are used.
#
# Least-privilege: the automatic GITHUB_TOKEN is restricted to:
#   - contents: write      (push the generated branch)
#   - pull-requests: write (open the weekly PR)
# It is NOT granted admin, secrets or other repository permissions.

name: Weekly Compliance Audit Sync

on:
  schedule:
    # At 06:00 UTC every Monday
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-compliance-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync compliance summary to README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run weekly compliance sync (git + GitHub API only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          USER_EMAIL: ${{ github.actor }}@users.noreply.github.com
          USER_NAME: ${{ github.actor }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --global user.name  "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          python scripts/weekly_compliance_sync.py
